# Nginx config for vibe.scendia.com.tw
# 放到 /etc/nginx/sites-available/vibe.scendia.com.tw
# 然後 ln -s /etc/nginx/sites-available/vibe.scendia.com.tw /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name vibe.scendia.com.tw;

    # Let's Encrypt 驗證用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP → HTTPS 重導向
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vibe.scendia.com.tw;

    # SSL 憑證（Let's Encrypt 產生後的路徑）
    ssl_certificate /etc/letsencrypt/live/vibe.scendia.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.scendia.com.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # 網站根目錄
    root /var/www/vibe.scendia.com.tw;
    index mario.html index.html;

    # SEO: 讓 mario.html 作為首頁
    location = / {
        try_files /mario.html =404;
    }

    # 靜態檔案快取（圖片、JSON 範例）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|json|js|css|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt 和 sitemap.xml
    location = /robots.txt {
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    # SEO headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GEO: 允許 AI crawler 讀取
    # （不設 X-Robots-Tag noai，讓 AI 搜尋引擎可以索引）

    # Gzip 壓縮
    gzip on;
    gzip_types text/html text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # 404 頁面
    error_page 404 /mario.html;
}
